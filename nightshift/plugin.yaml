manifest_version: 2
name: nightshift
version: 0.1.1
description: >-
  Hermes takes the night shift on your ML training runs. Nightshift watches a run's metrics, catches NaN, loss
  spikes, divergence, OOM crashes and stalls, recovers the run within a playbook you approved, and alerts you
  with the chart. Disclosure: after your explicit approval (/nightshift approve or the pane's Approve button;
  the agent can only propose; there is no CLI approve) it launches the training command you approved as a
  background process with a minimal environment (no Hermes keys unless named in env_passthrough) and may
  stop or restart that process group with only the parameter changes the playbook declares; it reads the run's
  log, metric and checkpoint paths; it stores run data in its plugin data folder; on a critical incident it may
  make capped LLM calls on your configured model and send an alert with Hermes's own `hermes send` command to your
  messaging platform. No telemetry and no network calls of its own.
author: Pavilion-devs
license: MIT
homepage: https://github.com/Pavilion-devs/nightshift
requires_hermes: ">=0.23.0"
tags: [ml, training, monitoring, mlops, alerts]
provides_tools:
  - nightshift_launch
  - nightshift_watch
  - nightshift_status
  - nightshift_run
  - nightshift_report
  - nightshift_ack
provides_hooks:
  - pre_llm_call
  - on_session_start
config_schema:
  alert_target:
    type: str
    default: ""
    description: >-
      Where to push critical alerts, as a `hermes send --to` target (e.g. "telegram" for its home channel, "telegram:<chat id>"). Empty:
      the platform the run was requested from, if it was a chat. "none" turns pushes off.
  diagnose:
    type: bool
    default: true
    description: Ask your model for a one-line root cause on critical incidents (after recovery, capped per run).
  max_diagnoses:
    type: int
    default: 3
    description: Most diagnosis calls per run.
  poll_seconds:
    type: float
    default: 2.0
    description: How often each run's metrics are read (minimum 0.5).
  start_grace_seconds:
    type: float
    default: 8.0
    description: >-
      A Hermes process must have been running this long before Nightshift launches, adopts or acts on a run,
      so one-shot commands never touch a job. Long-lived processes (gateway, Desktop, chat) take over after it.
