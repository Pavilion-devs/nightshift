[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-nightshift"
version = "0.1.0"
description = "Hermes takes the night shift on your ML training runs: watch, detect, recover, alert."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Pavilion-devs" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1", "fastapi>=0.110,<1", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["nightshift*"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["examples/tinygpt"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
allowed-confusables = ["×", "➖"]

[tool.ruff.lint.pycodestyle]
max-line-length = 120  # the formatter wraps code at 110; prose in docstrings/comments may run to 120

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
